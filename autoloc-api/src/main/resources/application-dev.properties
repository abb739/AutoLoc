# Profil "dev" : surcharge application.properties quand il est activé
# IntelliJ : Run > Edit Configurations > Active profiles = dev
# Maven    : mvnw spring-boot:run -Dspring-boot.run.profiles=dev

# Logs applicatifs plus détaillés en développement
logging.level.tn.esprit.autoloc=DEBUG

# Affiche les valeurs liées aux requêtes SQL (paramètres des ?)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
