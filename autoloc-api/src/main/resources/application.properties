spring.application.name=autoloc-api
server.port=8081
server.servlet.context-path=/api

# Connexion à la base de données
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

# Jackson : construire les entités par le constructeur sans argument + setters
# (Jackson 3 lit les noms de paramètres et choisirait le constructeur @AllArgsConstructor :
# les champs absents du JSON deviendraient null au lieu de garder leur initialisation)
spring.jackson.mapper.detect-parameter-names=false
# Champs JSON dans l'ordre de déclaration de l'entité (Jackson 3 trie par ordre alphabétique par défaut)
spring.jackson.mapper.sort-properties-alphabetically=false

# Swagger UI : groupes et opérations triés
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
